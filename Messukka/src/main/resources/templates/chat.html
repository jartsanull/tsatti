<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <<link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" /> 
    <title>Chat</title>
</head>
<body>
    <h1 style="text-align: center">Tervetuloa Messukkaan!!</h1>
    <div id="messages">
        <ul>
            <li th:each="message : ${messages}" style="text-align: center; list-style: none">
             <span th:text="${message.sender}"></span>: <span th:text="${message.content}"></span>
          </li>
        </ul>
    </div>
    <form action="/send" method="post" style="text-align: center">
        <input type="text" name="content" placeholder="Type your message...">
        <button type="submit" class="btn btn-sm btn-primary">Send</button>
    </form>
    
    <script>
    	var socket = new SockJS('/ws');
    	var stompClient = Stomp.over(socket);
    	
    	stompClient.connect({}, function (frame){
    		console.log('Connected: '+ frame);
    		stompClient.subscribe('/topic/public', function (messageOutput){
    			showMessage(JSON.parse(messageOutput.body));
    		});
    	});
    	
    	function send(){
    		var messageContent = document.geElementById('messageInput').value.trim();
    		if(messageContent && stompClient){
    			stompClient.send("/app/chat.sendMessage", {}, JSON.stringify({'content': messageContent}));
                document.getElementById('messageInput').value = '';
    		}
    	}
    	
    	function showMessage(message) {
            var messages = document.getElementById('messages');
            var messageElement = document.createElement('li');

            messageElement.classList.add('chat-message');
            messageElement.style.textAlign = 'center';
            messageElement.style.listStyle = 'none';

            var senderElement = document.createElement('span');
            senderElement.textContent = message.sender + ": ";
            messageElement.appendChild(senderElement);

            var contentElement = document.createElement('span');
            contentElement.textContent = message.content;
            messageElement.appendChild(contentElement);

            messages.appendChild(messageElement);
        }

        document.getElementById('sendButton').addEventListener('click', sendMessage);
   	
    </script>
</body>
</html>
